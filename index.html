<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>원소 탐험대 · 생물을 이루는 물질</title>
<style>
  :root{
    --purple1:#667eea; --purple2:#764ba2;
    --carb:#f5b400;      /* 탄수화물 노랑 */
    --protein:#ff6b6b;   /* 단백질 빨강 */
    --lipid:#ff9933;     /* 지방 주황 */
    --nucleic:#4a6cf7;   /* 핵산 파랑 */
    --ok:#2fb56b; --bad:#f5576c;
    --ink:#2a2540; --muted:#8a86a0;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Segoe UI','Malgun Gothic',Tahoma,sans-serif;
    background:linear-gradient(135deg,var(--purple1),var(--purple2));
    color:var(--ink); min-height:100vh; overflow-x:hidden;
  }
  #app{min-height:100vh;display:flex;flex-direction:column}
  button{font-family:inherit;cursor:pointer;border:none}
  .en{font-size:.72em;opacity:.75;font-weight:500}

  /* ---------- 홈 ---------- */
  .home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:32px 20px;gap:18px}
  .home .emoji{font-size:4.5rem;animation:float 3s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  .home h1{color:#fff;font-size:2.4rem;text-shadow:0 3px 10px rgba(0,0,0,.25);line-height:1.25}
  .home h1 .en{display:block;margin-top:4px}
  .home p{color:rgba(255,255,255,.9);font-size:1.05rem;max-width:520px;line-height:1.6}
  .startBtn{margin-top:10px;background:#fff;color:var(--purple2);font-weight:800;
    font-size:1.15rem;padding:16px 48px;border-radius:40px;box-shadow:0 8px 24px rgba(0,0,0,.22);
    transition:transform .15s}
  .startBtn:active{transform:scale(.96)}
  .home .tags{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
  .home .tags span{background:rgba(255,255,255,.18);color:#fff;padding:6px 14px;border-radius:20px;font-size:.85rem}

  /* ---------- 공통 상단바 ---------- */
  .topbar{background:rgba(255,255,255,.96);backdrop-filter:blur(6px);
    display:flex;align-items:center;gap:12px;padding:12px 16px;
    box-shadow:0 2px 12px rgba(0,0,0,.12);position:sticky;top:0;z-index:20;flex-wrap:wrap}
  .backBtn{background:#eef0fb;color:var(--purple2);font-weight:700;padding:9px 16px;border-radius:20px;font-size:.9rem}
  .backBtn:active{background:#e0e3f7}
  .topTitle{font-weight:800;color:var(--purple2);font-size:1.05rem;flex:1;min-width:120px}
  .badges{display:flex;gap:6px}
  .badges .b{font-size:1.4rem;filter:grayscale(1);opacity:.35;transition:.3s}
  .badges .b.on{filter:none;opacity:1;transform:scale(1.05)}
  .progWrap{width:100%;height:7px;background:#e6e6f0;border-radius:10px;overflow:hidden;margin-top:2px}
  .progFill{height:100%;background:linear-gradient(90deg,var(--purple1),var(--purple2));transition:width .5s;border-radius:10px}

  /* ---------- 스테이지 선택 ---------- */
  .wrap{max-width:980px;margin:0 auto;width:100%;padding:22px 16px 60px}
  .sectionTitle{color:#fff;text-align:center;margin:10px 0 22px;font-size:1.5rem;text-shadow:0 2px 8px rgba(0,0,0,.2)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
  .card{background:#fff;border-radius:18px;padding:26px 20px;text-align:center;position:relative;
    border:3px solid transparent;transition:transform .25s,box-shadow .25s;cursor:pointer}
  .card:not(.locked):active{transform:scale(.98)}
  .card:not(.locked):hover{transform:translateY(-6px);box-shadow:0 14px 30px rgba(0,0,0,.22)}
  .card .ic{font-size:3rem;margin-bottom:10px}
  .card h3{font-size:1.25rem;margin-bottom:4px}
  .card .sub{color:var(--muted);font-size:.85rem;line-height:1.4;min-height:34px}
  .card .chip{position:absolute;top:12px;right:12px;font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:14px}
  .card.locked{opacity:.6;cursor:not-allowed}
  .card.locked .chip{background:#d9d9e3;color:#6b6b7a}
  .card.done{border-color:var(--ok)}
  .card.done .chip{background:var(--ok);color:#fff}
  .card.play .chip{background:var(--carb);color:#5a4200}
  .card .go{margin-top:14px;display:inline-block;background:linear-gradient(135deg,var(--purple1),var(--purple2));
    color:#fff;font-weight:700;padding:9px 22px;border-radius:22px;font-size:.9rem}

  /* ---------- 스테이지 내부(미니게임 목록) ---------- */
  .intro{background:rgba(255,255,255,.95);border-radius:16px;padding:20px 22px;margin-bottom:20px;line-height:1.65}
  .intro h2{color:var(--carb);margin-bottom:6px}
  .intro .lead{color:var(--muted)}

  /* ---------- 미니게임 공통 ---------- */
  .panel{background:#fff;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 6px 20px rgba(0,0,0,.14)}
  .goal{background:linear-gradient(135deg,#fff7df,#fdeec0);border-left:5px solid var(--carb);
    border-radius:12px;padding:14px 18px;margin-bottom:18px;line-height:1.55}
  .goal b{color:#7a5a00}
  .qnum{color:var(--muted);font-weight:700;font-size:.85rem;letter-spacing:.5px}
  h2.gh{font-size:1.35rem;margin:2px 0 4px}
  .hint{background:#eef6ff;border-radius:10px;padding:10px 14px;color:#2b5a8c;font-size:.9rem;margin-top:10px;line-height:1.5}
  .feedback{border-radius:12px;padding:14px 16px;font-weight:700;text-align:center;margin:14px 0;line-height:1.5;display:none}
  .feedback.correct{display:block;background:#e6f8ee;color:#1e7d49;border:2px solid var(--ok)}
  .feedback.incorrect{display:block;background:#fdecef;color:#b32744;border:2px solid var(--bad)}
  .btnRow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}
  .primary{background:linear-gradient(135deg,var(--purple1),var(--purple2));color:#fff;font-weight:800;
    padding:14px 34px;border-radius:30px;font-size:1.05rem;transition:transform .15s}
  .primary:active{transform:scale(.96)}
  .primary:disabled{opacity:.45;cursor:not-allowed}
  .ghost{background:#eef0fb;color:var(--purple2);font-weight:700;padding:14px 26px;border-radius:30px}

  /* 원자 조립 게임 */
  .lab{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
  .palette{flex:1;min-width:220px}
  .palette h4,.flaskBox h4{font-size:.95rem;color:var(--muted);margin-bottom:10px}
  .atoms{display:flex;gap:14px;flex-wrap:wrap}
  .atom{width:64px;height:64px;border-radius:50%;display:flex;flex-direction:column;align-items:center;
    justify-content:center;color:#fff;font-weight:800;font-size:1.4rem;user-select:none;
    box-shadow:0 4px 10px rgba(0,0,0,.2);touch-action:none;position:relative}
  .atom small{font-size:.6rem;font-weight:600;opacity:.9}
  .atom.C{background:#3b3b47}.atom.H{background:#5aa9e6}.atom.O{background:#e5484d}
  .atom.drag{position:fixed;z-index:999;pointer-events:none;opacity:.92;transform:translate(-50%,-50%) scale(1.1)}
  .flaskBox{flex:1;min-width:240px}
  .flask{border:3px dashed #cfcfe0;border-radius:16px;min-height:150px;padding:14px;
    display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;transition:.2s;background:#fafaff}
  .flask.over{border-color:var(--carb);background:#fffdf3}
  .flask .mini{width:38px;height:38px;border-radius:50%;color:#fff;font-weight:800;display:flex;
    align-items:center;justify-content:center;font-size:.95rem;cursor:pointer}
  .flask .mini.C{background:#3b3b47}.flask .mini.H{background:#5aa9e6}.flask .mini.O{background:#e5484d}
  .counts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .count{flex:1;min-width:80px;background:#f4f4fb;border-radius:12px;padding:10px;text-align:center}
  .count .n{font-size:1.3rem;font-weight:800}
  .count.ok .n{color:var(--ok)}
  .count .lab2{font-size:.78rem;color:var(--muted)}
  .formula{text-align:center;font-size:1.5rem;font-weight:800;margin-top:12px;letter-spacing:1px}
  .formula sub{font-size:.7em}

  /* 분류 게임 */
  .pool{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:18px;min-height:56px}
  .token{background:#fff;border:2px solid #dcdcea;border-radius:14px;padding:10px 16px;font-weight:700;
    box-shadow:0 3px 8px rgba(0,0,0,.1);touch-action:none;user-select:none;transition:.15s}
  .token .en{display:block}
  .token.drag{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-50%) scale(1.06);box-shadow:0 10px 20px rgba(0,0,0,.25)}
  .token.placed{border-color:var(--ok)}
  .bins{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .bin{background:#f6f6fc;border:3px dashed #d3d3e4;border-radius:16px;padding:14px 10px;min-height:150px;transition:.2s}
  .bin.over{border-color:var(--carb);background:#fffdf3}
  .bin h4{text-align:center;font-size:1rem;margin-bottom:4px}
  .bin .desc{text-align:center;font-size:.75rem;color:var(--muted);margin-bottom:10px;min-height:30px}
  .bin .drop{display:flex;flex-direction:column;gap:8px;align-items:center}

  /* 매칭 게임 */
  .matchRow{display:flex;flex-direction:column;gap:14px}
  .matchItem{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}
  .matchTarget{flex:1;min-width:150px;background:#f4f4fb;border-radius:14px;padding:14px;display:flex;
    align-items:center;gap:10px}
  .matchTarget .big{font-size:1.6rem}
  .matchTarget .mt-name{font-weight:800}
  .matchDrop{flex:1.4;min-width:180px;border:3px dashed #d3d3e4;border-radius:14px;min-height:58px;
    display:flex;align-items:center;justify-content:center;padding:8px 12px;text-align:center;
    color:var(--muted);font-size:.9rem;transition:.2s}
  .matchDrop.over{border-color:var(--carb);background:#fffdf3}
  .matchDrop.filled{border-style:solid;color:var(--ink);font-weight:600}

  /* 구조식 뷰어 */
  .structBox{text-align:center}
  .structBox svg{max-width:340px;width:100%;height:auto}
  .toggleRow{display:flex;gap:8px;justify-content:center;margin:8px 0 4px}
  .toggleRow button{background:#eef0fb;color:var(--purple2);font-weight:700;padding:8px 16px;border-radius:20px;font-size:.85rem}
  .toggleRow button.active{background:var(--purple2);color:#fff}

  /* 완료 화면 */
  .clear{text-align:center;padding:20px}
  .clear .medal{font-size:5rem;animation:pop .6s ease}
  @keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
  .clear h2{color:#fff;margin:10px 0}
  .clear .badgeGet{background:rgba(255,255,255,.95);border-radius:16px;padding:18px;margin:16px auto;max-width:420px}
  .clear .badgeGet .bi{font-size:2.5rem}

  /* ---------- 광합성 반응로 ---------- */
  .eqBox{margin-top:10px;background:#fff;border:2px solid #f0d48a;border-radius:10px;padding:10px 12px;
    text-align:center;font-weight:800;font-size:1.02rem;color:#7a5a00;letter-spacing:.3px;overflow-x:auto;white-space:nowrap}
  .eqBox b{color:#c0392b}
  .reactorWrap{display:flex;gap:16px;flex-wrap:wrap;align-items:stretch;margin-bottom:12px}
  .sources{display:flex;flex-direction:column;gap:12px;min-width:150px;flex:1}
  .srcCol{background:#f6f6fc;border-radius:14px;padding:14px;text-align:center}
  .srcCol h4{font-size:.9rem;color:var(--muted);margin-bottom:10px}
  .srcCol .en{font-size:.66rem}
  .srcCol small{display:block;color:#b0b0be;font-size:.7rem;margin-top:8px}
  .mol{display:inline-block;cursor:grab;touch-action:none;user-select:none;transition:transform .12s}
  .mol:active{transform:scale(.9)}
  .mol.drag{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-50%) scale(1.15)}
  .reactor{flex:2;min-width:240px;min-height:190px;border-radius:18px;position:relative;
    background:radial-gradient(circle at 50% 25%,#effbe3,#c7ecac);border:3px dashed #8fd15a;
    display:flex;flex-direction:column;align-items:center;padding:14px;overflow:hidden}
  .reactor.over{border-color:#f5b400;background:radial-gradient(circle at 50% 25%,#fffbe8,#ffe6a0)}
  .reactor .sun{position:absolute;top:8px;right:12px;font-size:1.7rem;filter:drop-shadow(0 0 8px rgba(255,210,63,.8))}
  .reactorLabel{font-weight:800;color:#4a7a2a;margin-bottom:10px}
  .molBucket{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;align-content:flex-start;width:100%}
  .chip{cursor:pointer;background:#fff;border-radius:10px;padding:4px 6px;box-shadow:0 2px 5px rgba(0,0,0,.12);display:flex;align-items:center}
  .atomTally{text-align:center;color:var(--muted);font-size:.92rem;margin:8px 0}
  .atomTally b{color:var(--ink)}
  .o2bubble{position:absolute;bottom:22px;background:#fff;border-radius:8px;padding:2px 4px;box-shadow:0 2px 5px rgba(0,0,0,.15);animation:rise 1.7s ease-in forwards}
  @keyframes rise{to{transform:translateY(-170px);opacity:0}}
  .productPop{animation:pop .5s}

  /* ---------- 아미노산 조립 ---------- */
  .aaWrap{display:flex;justify-content:center;margin-bottom:18px}
  .aaGrid{display:grid;grid-template-columns:repeat(3,auto);gap:10px;align-items:center;justify-items:center}
  .aaCore{width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ff8787);
    color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-weight:800;font-size:1.3rem;box-shadow:0 4px 12px rgba(0,0,0,.28)}
  .aaCore small{font-size:.55rem;font-weight:600;opacity:.9}
  .aaSlot{width:96px;min-height:50px;border:2px dashed #cfcfe0;border-radius:12px;background:#fafaff;
    display:flex;align-items:center;justify-content:center;padding:4px}

  /* ---------- 마을 퀴즈 ---------- */
  .quizChoices{display:flex;flex-direction:column;gap:10px;margin-top:6px}
  .choiceBtn{width:100%;text-align:left;background:#f6f6fc;border:2px solid #e2e2ee;border-radius:14px;
    padding:14px 18px;font-size:1rem;font-weight:600;color:var(--ink);transition:transform .12s,background .15s,border-color .15s}
  .choiceBtn:not(.locked):hover{border-color:var(--purple1);background:#eef0fb}
  .choiceBtn:not(.locked):active{transform:scale(.98)}
  .choiceBtn.locked{cursor:default}
  .choiceBtn.right{background:#e6f8ee;border-color:var(--ok);color:#1e7d49}
  .choiceBtn.right::after{content:' ✓';font-weight:800;color:var(--ok)}
  .choiceBtn.wrong{background:#fdecef;border-color:var(--bad);color:#b32744}
  .choiceBtn.wrong::after{content:' ✕';font-weight:800;color:var(--bad)}
  /* 조립형 미니게임 공용 드롭존 */
  .dz{transition:border-color .15s,background .15s}
  .dz.over{border-color:#f5b400 !important;background:#fffdf3 !important}

  /* ---------- 월드맵 ---------- */
  .mapWrap{max-width:820px;margin:0 auto;width:100%;padding:14px 12px 24px}
  .mapHead{text-align:center;color:#fff;margin:4px 0 12px}
  .mapHead h2{font-size:1.4rem;text-shadow:0 2px 8px rgba(0,0,0,.25)}
  .mapHead p{opacity:.9;font-size:.9rem;margin-top:4px}
  /* 밝은 만화풍 하늘+초원 배경 */
  .mapScene{position:relative;width:100%;height:min(72vh,600px);border-radius:24px;overflow:hidden;
    background:linear-gradient(180deg,#7ec8f0 0%,#a9dcff 30%,#d6f2ff 52%,#e2f6cf 66%,#bfe89a 100%);
    box-shadow:inset 0 0 0 4px rgba(255,255,255,.5),0 14px 34px rgba(60,90,120,.3);
    border:3px solid #fff;touch-action:manipulation}
  .sun{position:absolute;top:16px;right:20px;width:56px;height:56px;border-radius:50%;
    background:radial-gradient(circle at 40% 40%,#fff6b0,#ffd23f 70%);
    box-shadow:0 0 26px rgba(255,210,63,.7);z-index:1;pointer-events:none}
  .hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:44%;z-index:1;pointer-events:none}
  .cloud{position:absolute;z-index:2;pointer-events:none;opacity:.96;
    filter:drop-shadow(0 4px 5px rgba(80,110,140,.12));animation:cloudDrift 22s ease-in-out infinite}
  .cloud.c2{animation-duration:30s;animation-delay:-6s;opacity:.9}
  .cloud.c3{animation-duration:26s;animation-delay:-12s;opacity:.85}
  @keyframes cloudDrift{0%,100%{transform:translateX(0)}50%{transform:translateX(22px)}}
  .biome{position:absolute;width:min(40vw,210px);height:min(40vw,210px);transform:translate(-50%,-50%);
    border-radius:50%;filter:blur(14px);opacity:.22;pointer-events:none;z-index:1;mix-blend-mode:soft-light}
  .particle{position:absolute;border-radius:50%;pointer-events:none;z-index:3;
    background:rgba(255,255,255,.8);width:6px;height:6px;animation:drift 7s ease-in-out infinite}
  .particle.p1{width:9px;height:9px;background:rgba(255,210,63,.7);animation-duration:9s}
  .particle.p2{width:5px;height:5px;background:rgba(120,200,255,.75);animation-duration:6s}
  .particle.p3{width:7px;height:7px;background:rgba(255,140,160,.6);animation-duration:8s}
  @keyframes drift{0%,100%{transform:translateY(0);opacity:.3}50%{transform:translateY(-14px);opacity:.85}}
  .roadSvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
  .node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;
    align-items:center;gap:5px;cursor:pointer;width:112px;text-align:center;z-index:6}
  .node .landmark{position:relative;width:78px;height:78px;transition:transform .2s;
    filter:drop-shadow(0 4px 3px rgba(40,70,100,.28))}
  .node .landmark svg{width:100%;height:100%;display:block}
  .node .cornerBadge{position:absolute;top:2px;right:8px;width:24px;height:24px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:800;color:#fff;
    box-shadow:0 2px 6px rgba(0,0,0,.35);z-index:3;border:2px solid #fff}
  .cornerBadge.done{background:var(--ok)}
  .cornerBadge.lock{background:#7a7a8c}
  .node .nlabel{color:#fff;font-size:.78rem;font-weight:800;line-height:1.15;
    background:rgba(40,55,90,.72);padding:3px 11px;border-radius:12px;box-shadow:0 2px 5px rgba(0,0,0,.2)}
  .node.locked .landmark{filter:grayscale(.8) brightness(.9) drop-shadow(0 4px 3px rgba(40,70,100,.28))}
  .node.locked{cursor:not-allowed}
  .node.locked .nlabel{opacity:.8}
  .node:not(.locked):active .landmark{transform:scale(.9)}
  .node.current .landmark::after{content:'';position:absolute;inset:6px;border-radius:50%;
    border:3px solid rgba(255,196,40,.95);box-shadow:0 0 10px rgba(255,196,40,.7);
    animation:ringPulse 1.6s ease-out infinite}
  @keyframes ringPulse{0%{transform:scale(.8);opacity:.95}100%{transform:scale(1.5);opacity:0}}
  /* 캐릭터는 노드 왼쪽에 비켜 서서 랜드마크를 가리지 않음 */
  .hero{position:absolute;transform:translate(-104%,-60%);z-index:9;width:44px;
    transition:left .8s ease-in-out,top .8s ease-in-out;pointer-events:none}
  .hero svg{width:100%;height:auto;display:block;filter:drop-shadow(0 4px 3px rgba(40,70,100,.35))}
  .hero::after{content:'';position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:26px;height:7px;
    border-radius:50%;background:rgba(40,70,100,.26);filter:blur(3px);z-index:-1}
  .hero.walking{animation:bob .3s infinite}
  @keyframes bob{0%,100%{transform:translate(-104%,-60%)}50%{transform:translate(-104%,-70%)}}
  /* 걷기: 다리 번갈아 흔들기 */
  .hero svg .leg{transform-box:fill-box;transform-origin:top center}
  .hero.walking svg .legL{animation:step .32s infinite}
  .hero.walking svg .legR{animation:step .32s infinite reverse}
  @keyframes step{0%,100%{transform:rotate(7deg)}50%{transform:rotate(-7deg)}}
  .mapAction{max-width:820px;margin:14px auto 0;background:rgba(255,255,255,.96);border-radius:16px;
    padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 6px 20px rgba(0,0,0,.18)}
  .mapAction .info{flex:1;min-width:150px}
  .mapAction .info h3{font-size:1.05rem}
  .mapAction .info .sub{color:var(--muted);font-size:.85rem;line-height:1.4}
  .mapAction .nav{display:flex;gap:8px}
  .navBtn{background:#eef0fb;color:var(--purple2);font-weight:800;width:48px;height:48px;border-radius:14px;font-size:1.15rem}

<body>

<script>
/* =========================================================================
   원소 탐험대 — 생물을 이루는 물질 (탄수화물 스테이지)
   단일 HTML · 모바일 pointer 드래그 지원 · 한국어 우선
   ========================================================================= */

const STAGES = [
  {id:'carb',    name:'탄수화물 월드', en:'Carbohydrate World', ic:'🍞', color:'--carb',
   sub:'C·H·O로 포도당을 짓고 다당류를 이해', badge:'⚡', status:'play'},

   sub:'아미노산과 펩타이드 결합', badge:'🔮', status:'lock'},
  {id:'lipid',   name:'지방 저장소',   en:'Lipid Storage', ic:'💧', color:'--lipid',
   sub:'글리세롤·지방산, 포화/불포화', badge:'🔥', status:'lock'},
  {id:'nucleic', name:'정보 도서관',   en:'Nucleic Acid', ic:'📚', color:'--nucleic',
   sub:'염기쌍과 DNA 이중나선', badge:'🧭', status:'lock'},
];

// 진행 상태 (localStorage 저장)
const SAVE_KEY = 'bioGame_v1';
let save = load();
function load(){ try{return JSON.parse(localStorage.getItem(SAVE_KEY))||{done:{}}}catch(e){return {done:{}}} }
function persist(){ try{localStorage.setItem(SAVE_KEY,JSON.stringify(save))}catch(e){} }
function stageDone(id){ return !!save.done[id]; }

const app = document.getElementById('app');
function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

/* ---------------- 재사용 드래그 헬퍼 (pointer 이벤트, 터치/마우스 공용) ------- */
function makeDraggable(el, {getGhost, onDropTo, dropSelector, onStart, onEnd}){
  el.style.touchAction='none';
  el.addEventListener('pointerdown', e=>{
    if(el.dataset.locked==='1') return;
    e.preventDefault();
    const ghost = getGhost ? getGhost(el) : el.cloneNode(true);
    ghost.classList.add('drag');
    document.body.appendChild(ghost);
    let lastOver=null;
    onStart && onStart(el);
    const move = ev=>{
      ghost.style.left = ev.clientX+'px';
      ghost.style.top  = ev.clientY+'px';
      ghost.style.display='none';
      const under = document.elementFromPoint(ev.clientX, ev.clientY);
      ghost.style.display='';
      const zone = under ? under.closest(dropSelector) : null;
      if(zone!==lastOver){
        lastOver && lastOver.classList.remove('over');
        zone && zone.classList.add('over');
        lastOver = zone;
      }
    };
    const up = ev=>{
      window.removeEventListener('pointermove',move);
      window.removeEventListener('pointerup',up);
      ghost.remove();
      lastOver && lastOver.classList.remove('over');
      const under = document.elementFromPoint(ev.clientX, ev.clientY);
      const zone = under ? under.closest(dropSelector) : null;
      onEnd && onEnd(el);
      if(zone) onDropTo(el, zone);
    };
    window.addEventListener('pointermove',move,{passive:false});
    window.addEventListener('pointerup',up);
  });
}

/* ============================ 화면: 홈 ============================ */
function renderHome(){
  app.innerHTML = `
  <div class="home">

}

/* ====================== 화면: 월드맵 ====================== */
function topbar(title, onBack){
  const total = STAGES.length;
  const done = STAGES.filter(s=>stageDone(s.id)).length;
  const pct = Math.round(done/total*100);
  const badgeHtml = STAGES.map(s=>`<span class="b ${stageDone(s.id)?'on':''}" title="${s.name}">${s.badge}</span>`).join('');
  return `
  <div class="topbar">
    <button class="backBtn" id="back">← 뒤로</button>
    <div class="topTitle">${title}</div>
    <div class="badges">${badgeHtml}</div>
    <div class="progWrap"><div class="progFill" style="width:${pct}%"></div></div>
  </div>`;
}

    {id:'lipid',   name:'지방 저장소',   en:'Lipid',       ic:'💧', x:27, y:41, kind:'stage', color:css('--lipid'),   sub:'중성지방 조립·포화/불포화 + 퀴즈', go:()=>renderVillageStage('lipid')},

function nodeUnlocked(nodes, i){
  if(i<=1) return true;                       // 출발지, 탄수화물은 항상 개방
  if(nodes[i].id==='boss') return ['carb','protein','lipid','nucleic'].every(id=>stageDone(id));

// 각 월드 노드의 미니 일러스트 (섬 + 랜드마크)

function renderWorldMap(){
  const nodes = MAP = mapNodes();
  let maxU = 0;
  nodes.forEach((n,i)=>{ if(nodeUnlocked(nodes,i)) maxU=i; });
  if(!mapInited){ heroIndex = 0; mapInited = true; }   // 첫 진입은 출발지에서 걸어 올라감
  if(heroIndex > maxU) heroIndex = maxU;

  // 구역별 컬러 바이옴 (스테이지 색으로 물든 영역)
  // 구역별 컬러 바이옴(은은하게 물든 영역)
  const biomes = nodes.filter(n=>n.id!=='start')
    .map(n=>`<div class="biome" style="left:${n.x}%;top:${n.y}%;background:radial-gradient(circle,${n.color},transparent 70%)"></div>`).join('');
  // 만화풍 구름
  const clouds = [
    {c:'c1',x:14,y:12,w:120},{c:'c2',x:66,y:8,w:150},{c:'c3',x:40,y:24,w:96}
  ].map(o=>`<div class="cloud ${o.c}" style="left:${o.x}%;top:${o.y}%;width:${o.w}px">${cloudSVG()}</div>`).join('');
  // 반짝이는 입자
  const particles = Array.from({length:6}).map((_,i)=>{
    const x=(i*37+9)%88+6, y=(i*53+18)%70+8, cls='p'+(i%4), delay=(i*0.7)%5;
    return `<div class="particle ${cls}" style="left:${x}%;top:${y}%;animation-delay:${delay}s"></div>`;
  }).join('');

  app.innerHTML = topbar('원소 월드맵 🗺️') + `
  <div class="mapWrap">
    <div class="mapHead">
      <h2>🗺️ 원소 월드맵</h2>
      <p>탐험가를 움직여 각 월드에 입장하세요 · 아래 ⬆️⬇️ 또는 지점을 탭</p>
    </div>
    <div class="mapScene" id="scene">
      <div class="sun"></div>
      <svg class="hills" viewBox="0 0 400 130" preserveAspectRatio="none">
        <path d="M0,58 C70,26 130,72 210,50 C290,28 350,66 400,44 L400,130 L0,130 Z" fill="#b7e483"/>
        <path d="M0,84 C90,54 170,96 250,72 C330,50 380,88 400,70 L400,130 L0,130 Z" fill="#8fd15a"/>
        <path d="M0,108 C100,88 180,118 260,100 C330,86 380,110 400,100 L400,130 L0,130 Z" fill="#6cbf43"/>
      </svg>
      ${biomes}${clouds}${particles}
      <svg class="roadSvg" viewBox="0 0 100 100" preserveAspectRatio="none">
        <polyline id="roadBase" fill="none" stroke="rgba(90,60,30,.28)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
        <polyline id="roadMid" fill="none" stroke="#e9cfa4" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
        <polyline id="roadDash" fill="none" stroke="#fff" stroke-width="2.4" stroke-dasharray="0.1 6.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      </svg>
      <div class="hero" id="hero">${heroSVG()}</div>
    </div>
    <div class="mapAction" id="action"></div>
  </div>`;
  document.getElementById('back').onclick = ()=>{ document.onkeydown=null; renderHome(); };

  const scene = document.getElementById('scene');
  const pts = nodes.map(n=>`${n.x},${n.y}`).join(' ');
  scene.querySelectorAll('.roadSvg polyline').forEach(p=>p.setAttribute('points', pts));

  nodes.forEach((n,i)=>{
    const unlocked = nodeUnlocked(nodes,i);
    const done = n.kind==='stage' && stageDone(n.id);
    const el = document.createElement('div');
    el.className = `node ${unlocked?'':'locked'} ${done?'done':''}`;
    el.style.left = n.x+'%'; el.style.top = n.y+'%';
    const badge = done ? '<span class="cornerBadge done">✓</span>'
                : (!unlocked ? '<span class="cornerBadge lock">🔒</span>' : '');
    el.innerHTML = `
      <div class="landmark">${nodeArt(n.id, done)}${badge}</div>
      <div class="nlabel">${n.name}</div>`;
    el.onclick = ()=>onNodeTap(i);
    scene.appendChild(el);
  });

  positionHero(false);
  markCurrentNode();
  updateMapAction();

  document.onkeydown = (e)=>{
    if(mapBusy) return;
    if(e.key==='ArrowUp'){ e.preventDefault(); onNodeTap(heroIndex+1); }
    else if(e.key==='ArrowDown'){ e.preventDefault(); onNodeTap(heroIndex-1); }
    else if(e.key==='Enter'){ enterNode(heroIndex); }
  };
}

function positionHero(animate){
  const hero = document.getElementById('hero'); if(!hero) return;
  const n = MAP[heroIndex];
  if(!animate){
    hero.style.transition='none';
    hero.style.left=n.x+'%'; hero.style.top=n.y+'%';
    requestAnimationFrame(()=>{ hero.style.transition=''; });
  }else{
    hero.style.left=n.x+'%'; hero.style.top=n.y+'%';
  }
}
function markCurrentNode(){
  document.querySelectorAll('.node').forEach((el,i)=>el.classList.toggle('current', i===heroIndex));
}

function onNodeTap(i){
  if(mapBusy) return;
  if(i<0 || i>=MAP.length) return;
  if(!nodeUnlocked(MAP,i)){ toast('아직 잠겨 있어요. 이전 월드를 먼저 완료하세요 🔒'); return; }
  if(i===heroIndex){ enterNode(i); return; }
  walkTo(i);
}

async function walkTo(target){
  if(mapBusy || target===heroIndex) return;
  if(!nodeUnlocked(MAP,target)){ toast('아직 잠겨 있어요 🔒'); return; }
  mapBusy = true;
  const hero = document.getElementById('hero');
  hero.classList.add('walking');
  const step = target>heroIndex ? 1 : -1;
  while(heroIndex!==target){
    heroIndex += step;
    positionHero(true);
    markCurrentNode();
    await wait(820);
  }
  hero.classList.remove('walking');
  mapBusy = false;
  updateMapAction();
}

function updateMapAction(){
  const el = document.getElementById('action'); if(!el) return;
  const n = MAP[heroIndex];
  const unlocked = nodeUnlocked(MAP, heroIndex);
  const nextUnlocked = heroIndex<MAP.length-1 && nodeUnlocked(MAP, heroIndex+1);
  let btn='';
  if(n.kind==='stage' && unlocked){
    btn = `<button class="enterBtn" id="enter">${stageDone(n.id)?'다시 입장 →':'입장하기 →'}</button>`;
  }else if(n.kind==='soon'){
    btn = `<button class="enterBtn soon" id="enter">곧 공개 🔒</button>`;
  }
  el.innerHTML = `
    <div class="info"><h3>${n.ic} ${n.name} <span class="en">${n.en}</span></h3>
      <div class="sub">${nodeSubtitle(n)}</div></div>
    <div class="nav">
      <button class="navBtn" id="down" ${heroIndex<=0?'disabled':''}>⬇️</button>
      <button class="navBtn" id="up" ${nextUnlocked?'':'disabled'}>⬆️</button>
    </div>
    ${btn}`;
  const up=document.getElementById('up'); if(up) up.onclick=()=>onNodeTap(heroIndex+1);
  const down=document.getElementById('down'); if(down) down.onclick=()=>onNodeTap(heroIndex-1);
  const enter=document.getElementById('enter'); if(enter) enter.onclick=()=>enterNode(heroIndex);
}

function enterNode(i){
  if(mapBusy) return;
  const n = MAP[i];
  if(!nodeUnlocked(MAP,i)){ toast('아직 잠겨 있어요 🔒'); return; }
  if(n.kind==='stage' && n.go){ document.onkeydown=null; n.go(); }
  else if(n.kind==='base'){ toast('출발지예요. 위쪽 월드로 올라가 보세요! ⬆️'); }
  else if(n.kind==='soon'){ toast(`${n.name}은(는) 곧 공개돼요! 지금은 탄수화물 월드를 즐겨보세요 🍞`); }
}

let toastTimer=null;
function toast(msg){
  let t=document.querySelector('.toast');
  if(!t){ t=document.createElement('div'); t.className='toast'; document.body.appendChild(t); }
  t.textContent=msg;
  requestAnimationFrame(()=>t.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2600);
}

/* ---------------- 미션 1: 광합성 반응로 ---------------- */
function gameAtom(){
  gameShell('광합성 반응로','Photosynthesis Reactor','미션 1 · 반응 조립',
    '☀️ 빛 에너지로 <b>CO₂ 6개</b>와 <b>H₂O 12개</b>를 엽록체 반응로에 넣어 포도당을 합성하세요. (넣은 분자를 누르면 빼기)'
    + '<div class="eqBox">6CO₂ + <b>12</b>H₂O → C₆H₁₂O₆ + 6O₂ + <b>6</b>H₂O</div>'
    + '<div style="font-size:.82rem;color:#7a5a00;margin-top:4px">💡 방출되는 산소(O₂)는 <b>물의 광분해</b>에서 나와요. 그래서 물이 <b>12개</b> 필요하고, 캘빈 회로에서 물 <b>6개</b>가 다시 생겨 순소비는 6개랍니다.</div>',
    'atomBody');
  const body=document.getElementById('atomBody');
  const state={co2:0, h2o:0, done:false};
  const TARGET={co2:6, h2o:12};
  const CAP={co2:9, h2o:16};
  body.innerHTML=`
    <div class="reactorWrap">
      <div class="sources">
        <div class="srcCol"><h4>CO₂ 공급 <span class="en">Carbon dioxide</span></h4>
          <div class="mol" data-mol="co2">${molCO2()}</div><small>끌어넣기 · 탭 +1</small></div>
        <div class="srcCol"><h4>H₂O 공급 <span class="en">Water</span></h4>
          <div class="mol" data-mol="h2o">${molH2O()}</div><small>끌어넣기 · 탭 +1</small></div>
      </div>
      <div class="reactor dz" id="reactor" data-drop>
        <div class="sun">☀️</div>
        <div class="reactorLabel">🟢 엽록체 반응로</div>
        <div class="molBucket" id="bucket"></div>
      </div>
    </div>
    <div class="counts">
      <div class="count" id="cCO2"><div class="n">0/6</div><div class="lab2">CO₂</div></div>
      <div class="count" id="cH2O"><div class="n">0/12</div><div class="lab2">H₂O</div></div>
    </div>
    <div class="atomTally" id="tally"></div>
    <div class="feedback" id="fb"></div>
    <div class="btnRow">
      <button class="ghost" id="reset">비우기</button>
      <button class="primary" id="react">☀️ 반응 시작</button>
    </div>
    <div id="product"></div>`;

  const bucket=document.getElementById('bucket');
  function draw(){
    bucket.innerHTML='';
    const add=(type,svg)=>{ for(let i=0;i<state[type];i++){
      const chip=document.createElement('div'); chip.className='chip'; chip.innerHTML=svg;
      chip.onclick=()=>{ if(state.done)return; state[type]--; draw(); };
      bucket.appendChild(chip);
    }};
    add('co2',molCO2()); add('h2o',molH2O());
    const setC=(id,cur,tgt)=>{const el=document.getElementById(id); el.querySelector('.n').textContent=cur+'/'+tgt; el.classList.toggle('ok',cur===tgt);};
    setC('cCO2',state.co2,TARGET.co2); setC('cH2O',state.h2o,TARGET.h2o);
    const C=state.co2, H=state.h2o*2, O=state.co2*2+state.h2o;
    document.getElementById('tally').innerHTML=`반응로 속 원자 → 탄소 C <b>${C}</b> · 수소 H <b>${H}</b> · 산소 O <b>${O}</b>`;
  }
  draw();

  document.querySelectorAll('.mol').forEach(m=>{
    const add=()=>{ if(state.done)return; const t=m.dataset.mol; if(state[t]<CAP[t]){state[t]++;draw();document.getElementById('fb').className='feedback';} };
    makeDraggable(m,{dropSelector:'[data-drop]', onDropTo:add});
    m.onclick=add;
  });

  document.getElementById('reset').onclick=()=>{ if(state.done)return; state.co2=state.h2o=0; draw(); document.getElementById('fb').className='feedback'; };
  document.getElementById('react').onclick=()=>{
    const fb=document.getElementById('fb');
    if(state.done) return;
    if(state.co2===TARGET.co2 && state.h2o===TARGET.h2o){
      state.done=true;
      fb.className='feedback correct';
      fb.innerHTML='광합성 성공! 🎉 좌변·우변 원자 수(C 6 · H 24 · O 24)가 완벽히 보존돼요.';
      reactAnimation();
      markDone('atom');
    }else{
      fb.className='feedback incorrect';
      const msg=[];
      if(state.co2!==TARGET.co2) msg.push(`CO₂ ${state.co2}→6`);
      if(state.h2o!==TARGET.h2o) msg.push(`H₂O ${state.h2o}→12`);
      fb.innerHTML=`원자 수가 맞지 않아요. <b>CO₂ 6개 + H₂O 12개</b>가 필요해요. (${msg.join(', ')})`;
    }
  };

  function reactAnimation(){
    const reactor=document.getElementById('reactor');
    bucket.innerHTML='';
    // 산소(O₂) 6개 + 부산물 물(H₂O) 6개 방출
    for(let i=0;i<6;i++){
      const o=document.createElement('div'); o.className='o2bubble'; o.innerHTML=molO2();
      o.style.left=(8+i*11)+'%'; o.style.animationDelay=(i*0.12)+'s';
      reactor.appendChild(o);
      const w=document.createElement('div'); w.className='o2bubble'; w.innerHTML=molH2O();
      w.style.left=(14+i*11)+'%'; w.style.animationDelay=(0.5+i*0.12)+'s';
      reactor.appendChild(w);
    }
    // 생성물 표시
    const glu=document.createElement('div'); glu.className='productPop';
    glu.style.cssText='margin-top:8px;text-align:center;font-weight:800;color:#4a7a2a;line-height:1.5';
    glu.innerHTML='✨ 포도당 C₆H₁₂O₆ <b>1</b>분자 생성<br>🫧 산소 O₂ <b>6</b>분자 방출 · 💧 물 H₂O <b>6</b>분자 재생성';
    bucket.appendChild(glu);
    showGlucoseReward(body);
  }
}

/* ---------------- 미션 2: 당류 분류소 ---------------- */
const SUGARS = [
  {ko:'포도당', en:'Glucose', type:'mono'},
  {ko:'과당',   en:'Fructose', type:'mono'},
  {ko:'갈락토스',en:'Galactose', type:'mono'},
  {ko:'엿당',   en:'Maltose', type:'di'},
  {ko:'설탕',   en:'Sucrose', type:'di'},
  {ko:'젖당',   en:'Lactose', type:'di'},
  {ko:'녹말',   en:'Starch', type:'poly'},
  {ko:'글리코겐',en:'Glycogen', type:'poly'},
  {ko:'셀룰로스',en:'Cellulose', type:'poly'},
];
const SUGAR_BINS=[
  {type:'mono', ko:'단당류', en:'Monosaccharide', desc:'더 못 쪼개지는 기본 당 (1개)'},
  {type:'di',   ko:'이당류', en:'Disaccharide',  desc:'단당류 2개가 결합'},
  {type:'poly', ko:'다당류', en:'Polysaccharide', desc:'단당류 수백~수천 개'},
];

function gameSort(){
  gameShell('당류 분류소','Sort the Sugars','미션 2 · 드래그 분류',
    '아래 9가지 당을 <b>단당류·이당류·다당류</b> 통으로 끌어다 넣으세요. 모두 실제 당이니 성질로 판단!',
    'sortBody');
  const body=document.getElementById('sortBody');
  const shuffled=[...SUGARS].map((s,i)=>({...s,uid:'s'+i})).sort(()=>Math.random()-.5);
  body.innerHTML=`
    <div class="pool" id="pool"></div>
    <div class="bins">
      ${SUGAR_BINS.map(b=>`
        <div class="bin" data-drop data-type="${b.type}">
          <h4>${b.ko}<div class="en">${b.en}</div></h4>
          <div class="desc">${b.desc}</div>
          <div class="drop"></div>
        </div>`).join('')}
    </div>
    <div class="feedback" id="fb"></div>
    <div class="btnRow">
      <button class="ghost" id="reset">다시</button>
      <button class="primary" id="submit">채점하기</button>
    </div>`;

  const pool=document.getElementById('pool');
  function makeToken(s){
    const t=document.createElement('div');
    t.className='token'; t.dataset.type=s.type; t.dataset.uid=s.uid;
    t.innerHTML=`${s.ko}<span class="en">${s.en}</span>`;
    makeDraggable(t,{
      dropSelector:'[data-drop]',
      onDropTo:(el,zone)=>{ zone.querySelector('.drop').appendChild(el); el.classList.remove('placed'); document.getElementById('fb').className='feedback'; }
    });
    return t;
  }
  shuffled.forEach(s=>pool.appendChild(makeToken(s)));
  // pool도 드롭 대상
  pool.setAttribute('data-drop','');

  document.getElementById('reset').onclick=()=>gameSort();
  document.getElementById('submit').onclick=()=>{
    const fb=document.getElementById('fb');
    let placed=0, correct=0;
    document.querySelectorAll('.bin').forEach(bin=>{
      const btype=bin.dataset.type;
      bin.querySelectorAll('.token').forEach(t=>{
        placed++;
        if(t.dataset.type===btype){correct++;t.classList.add('placed');}
        else t.classList.remove('placed');
      });
    });
    if(placed<SUGARS.length){
      fb.className='feedback incorrect';
      fb.innerHTML=`아직 <b>${SUGARS.length-placed}개</b>가 통에 담기지 않았어요.`;
      return;
    }
    if(correct===SUGARS.length){
      fb.className='feedback correct';
      fb.innerHTML='완벽해요! 🎉 단당류(포도당·과당·갈락토스), 이당류(엿당·설탕·젖당), 다당류(녹말·글리코겐·셀룰로스) 분류 성공!';
      markDone('sort');

const ROLES=[

function gameRole(){
  gameShell('다당류의 역할','Polysaccharide Roles','미션 3 · 짝 맞추기',
    '아래 <b>설명 카드</b>를 알맞은 다당류로 끌어다 놓으세요. 셋 다 포도당으로 이루어졌지만 역할이 달라요!',
    'roleBody');
  const body=document.getElementById('roleBody');
  const desc=[...ROLES].map((r,i)=>({...r,uid:'r'+i})).sort(()=>Math.random()-.5);
  body.innerHTML=`
    <div class="pool" id="pool"></div>
    <div class="matchRow">
      ${ROLES.map(r=>`
        <div class="matchItem">
          <div class="matchTarget"><span class="big">${r.ic}</span>
            <div><div class="mt-name">${r.ko}</div><div class="en">${r.en}</div></div></div>
          <div class="matchDrop" data-drop data-key="${r.ko}"><span class="ph">여기에 설명을 놓기</span></div>
        </div>`).join('')}
    </div>
    <div class="feedback" id="fb"></div>
    <div class="btnRow">
      <button class="ghost" id="reset">다시</button>
      <button class="primary" id="submit">채점하기</button>
    </div>`;

  desc.forEach(r=>{
    const t=document.createElement('div');
    t.className='token'; t.dataset.key=r.ko; t.style.maxWidth='260px';
    t.innerHTML=r.desc;
    makeDraggable(t,{
      dropSelector:'[data-drop]',
      onDropTo:(el,zone)=>{
        // 기존에 있던 카드는 pool로 돌려보냄
        const drop = zone.classList.contains('matchDrop')?zone:zone;
        if(zone.id==='pool'){ pool.appendChild(el); el.classList.remove('placed'); }
        else {
          const prev=zone.querySelector('.token');
          if(prev) pool.appendChild(prev);
          const ph=zone.querySelector('.ph'); if(ph) ph.style.display='none';
          zone.appendChild(el); zone.classList.add('filled');

  document.getElementById('reset').onclick=()=>gameRole();

    const fb=document.getElementById('fb');
    const drops=[...document.querySelectorAll('.matchDrop')];
    if(drops.some(d=>!d.querySelector('.token'))){
      fb.className='feedback incorrect'; fb.innerHTML='세 칸을 모두 채워 주세요.'; return;

function drawQuizQuestion(){
  const {villageId, i} = quizState;
  const items = VILLAGE_QUIZ[villageId];
  const item = items[i];
  quizState.answered = false;
  document.getElementById('qProgress').textContent = `문제 ${i+1} / ${items.length}`;
  document.getElementById('qText').textContent = item.q;
  const fb = document.getElementById('qFb'); fb.className='feedback'; fb.innerHTML='';
  document.getElementById('qBtnRow').innerHTML='';
  const box = document.getElementById('qChoices');
  box.innerHTML='';
  item.choices.forEach(ch=>{
    const b=document.createElement('button');
    b.className='choiceBtn'; b.textContent=ch;
    b.onclick=()=>pickChoice(b, ch, item);
    box.appendChild(b);
  });
}

function pickChoice(btn, choice, item){
  if(quizState.answered) return;
  quizState.answered = true;
  const correct = choice===item.answer;
  const buttons = [...document.querySelectorAll('.choiceBtn')];
  buttons.forEach(b=>{
    b.classList.add('locked');
    if(b.textContent===item.answer) b.classList.add('right');   // 정답 강조(학습)
  });
  if(!correct){ btn.classList.add('wrong'); quizState.wrong++; }
  const fb=document.getElementById('qFb');
  fb.className='feedback '+(correct?'correct':'incorrect');
  fb.innerHTML = correct ? '정답이에요! 🎉' : `아쉬워요. 정답은 <b>${item.answer}</b> 입니다.`;
  const items = VILLAGE_QUIZ[quizState.villageId];
  const last = quizState.i >= items.length-1;
  const row=document.getElementById('qBtnRow');
  row.innerHTML = `<button class="primary" id="qNext">${last?'결과 보기 →':'다음 문제 →'}</button>`;
  document.getElementById('qNext').onclick = ()=>{
    if(last){ renderQuizResult(); }
    else { quizState.i++; drawQuizQuestion(); }
  };
}

function renderQuizResult(){
  const {villageId, wrong, back} = quizState;
  const items = VILLAGE_QUIZ[villageId];
  const total = items.length, score = total - wrong;
  const meta = villageMeta(villageId);

  app.innerHTML = topbar(`${meta.name}${isBoss?' 👑':' · 마을 퀴즈'}`) + `

}

let vgProgress = {protein:{}, lipid:{}, nucleic:{}};
function markDoneVG(vid, mid){ vgProgress[vid][mid] = true; }

function renderVillageStage(vid){
  document.onkeydown = null;
  const v = VG[vid];
  app.innerHTML = topbar(`${v.name} ${v.ic}`) + `
  <div class="wrap">
    <div class="intro">
      <h2 style="color:${css(v.color)}">${v.name} <span class="en">${v.en}</span></h2>
      <p class="lead">${v.intro} 세 미션을 모두 완료하면 <b>${v.badge} 배지</b>를 얻어요!</p>
    </div>
    <div class="grid" id="games"></div>
  </div>`;
  document.getElementById('back').onclick = renderWorldMap;
  const g = document.getElementById('games');
  v.missions.forEach((m,i)=>{
    const done = !!vgProgress[vid][m.id];
    const el = document.createElement('div');
    el.className = `card ${done?'done':'play'}`;
    el.style.borderColor = done?css('--ok'):css(v.color);
    el.innerHTML = `<div class="chip">${done?'완료 ✓':'미션 '+(i+1)}</div>
      <div class="ic">${m.ic}</div><h3>${m.name}<div class="en">${m.en}</div></h3>
      <div class="sub">${m.sub}</div><span class="go">${done?'다시 하기':'도전 →'}</span>`;
    el.onclick = ()=>m.run();
    g.appendChild(el);
  });
  if(v.missions.every(m=>vgProgress[vid][m.id]) && !stageDone(vid)){ save.done[vid]=true; persist(); }
  if(stageDone(vid)){
    const note=document.createElement('div'); note.className='goal'; note.style.marginTop='18px';
    note.innerHTML=`🎉 <b>${v.badge} 배지 획득!</b> ${v.name}의 모든 미션을 완료했어요.
      <div class="btnRow" style="margin-top:12px"><button class="primary" id="toClearBtn">${v.badge} 배지 받고 월드맵으로 →</button></div>`;
    document.querySelector('.wrap').appendChild(note);
    document.getElementById('toClearBtn').onclick=()=>renderVillageClear(vid);
  }
}

function gameShellV(vid, title, en, num, goalHtml, bodyId){
  const v = VG[vid];
  app.innerHTML = topbar(`${v.name} ${v.ic}`) + `
  <div class="wrap"><div class="panel">

    <h2 class="gh">${title} <span class="en">${en}</span></h2>
    <div class="goal">${goalHtml}</div>

  </div></div>`;

function winMission(vid, mid){
  markDoneVG(vid, mid);

  if(body && !document.getElementById('nextm')){
    const r=document.createElement('div'); r.className='btnRow';
    r.innerHTML=`<button class="primary" id="nextm">미션 목록으로 →</button>`;

  }
}

function renderVillageClear(vid){

/* ---- 공용 분류 미니게임 ---- */
function binGame(cfg){
  const {vid, mid, title, en, num, goal, hint, items, bins, successMsg, rerun} = cfg;
  gameShellV(vid, title, en, num, goal, 'gb');
  const body = document.getElementById('gb');
  const shuffled = [...items].sort(()=>Math.random()-.5);
  body.innerHTML = `
    <div class="pool" id="pool"></div>
    <div class="bins" style="grid-template-columns:repeat(${bins.length},minmax(0,1fr))">
      ${bins.map(b=>`<div class="bin dz" data-drop data-key="${b.key}"><h4>${b.ko}<div class="en">${b.en||''}</div></h4><div class="desc">${b.desc||''}</div><div class="drop"></div></div>`).join('')}
    </div>
    ${hint?`<div class="hint">${hint}</div>`:''}
    <div class="feedback" id="fb"></div>
    <div class="btnRow"><button class="ghost" id="reset">다시</button><button class="primary" id="submit">채점하기</button></div>`;
  const pool = document.getElementById('pool'); pool.setAttribute('data-drop','');
  shuffled.forEach(s=>{
    const t=document.createElement('div'); t.className='token'; t.dataset.key=s.key; t.innerHTML=s.label;
    makeDraggable(t,{dropSelector:'[data-drop]', onDropTo:(el,zone)=>{
      (zone.classList.contains('bin')?zone.querySelector('.drop'):zone).appendChild(el);
      el.classList.remove('placed'); document.getElementById('fb').className='feedback';
    }});
    pool.appendChild(t);
  });
  document.getElementById('reset').onclick = rerun;
  document.getElementById('submit').onclick = ()=>{
    const fb=document.getElementById('fb'); let placed=0, correct=0;
    document.querySelectorAll('.bin').forEach(bin=>{
      bin.querySelectorAll('.token').forEach(t=>{ placed++;
        if(t.dataset.key===bin.dataset.key){correct++;t.classList.add('placed');} else t.classList.remove('placed'); });
    });
    if(placed<items.length){ fb.className='feedback incorrect'; fb.innerHTML=`아직 <b>${items.length-placed}개</b>가 통에 담기지 않았어요.`; return; }
    if(correct===items.length){ fb.className='feedback correct'; fb.innerHTML=successMsg||'완벽해요! 🎉'; winMission(vid, mid); }
    else { fb.className='feedback incorrect'; fb.innerHTML=`${correct}/${items.length} 정답. 초록 테두리가 아닌 카드를 다시 옮겨 보세요.`; }
  };
}

/* ---- 단백질 미션 1: 아미노산 조립 (기본 구조) ---- */
function gameAminoBuild(){
  const vid='protein';
  gameShellV(vid,'아미노산 조립소','Build an Amino Acid','미션 1 · 조립',
    '중심 탄소(C<sub>α</sub>)의 네 결합 자리에 아미노산을 이루는 <b>4가지 기</b>를 끌어다 놓으세요. (핵산의 성분은 필요 없어요)','gb');
  const body=document.getElementById('gb');
  body.innerHTML=`
    <div class="aaWrap">
      <div class="aaGrid">
        <div></div><div class="dz aaSlot" data-slot></div><div></div>
        <div class="dz aaSlot" data-slot></div>
        <div class="aaCore">C<sub>α</sub><small>중심 탄소</small></div>
        <div class="dz aaSlot" data-slot></div>
        <div></div><div class="dz aaSlot" data-slot></div><div></div>
      </div>
    </div>
    <div class="pool" id="pool"></div>
    <div class="feedback" id="fb"></div>
    <div class="btnRow"><button class="ghost" id="reset">다시</button><button class="primary" id="submit">확인</button></div>`;
  const pool=document.getElementById('pool');
  const NEED=['nh2','cooh','h','r'];
  const parts=[
    {k:'nh2',ko:'아미노기',f:'−NH₂'},{k:'cooh',ko:'카복실기',f:'−COOH'},
    {k:'h',ko:'수소',f:'−H'},{k:'r',ko:'곁사슬',f:'−R'},
    {k:'x',ko:'인산기',f:'−PO₄'},{k:'x',ko:'염기',f:'base'},
  ];
  parts.sort(()=>Math.random()-.5).forEach(p=>{
    const t=document.createElement('div'); t.className='token'; t.dataset.k=p.k;
    t.innerHTML=`${p.ko}<span class="en">${p.f}</span>`;
    makeDraggable(t,{dropSelector:'[data-slot],[data-drop]', onDropTo:(el,zone)=>{
      const slot=zone.closest('.aaSlot');
      if(!slot){ pool.appendChild(el); return; }
      const prev=slot.querySelector('.token'); if(prev) pool.appendChild(prev);
      slot.appendChild(el); document.getElementById('fb').className='feedback';
    }});
    pool.appendChild(t);
  });
  pool.setAttribute('data-drop','');
  document.getElementById('reset').onclick=gameAminoBuild;
  document.getElementById('submit').onclick=()=>{
    const fb=document.getElementById('fb');
    const slots=[...document.querySelectorAll('.aaSlot')];
    if(slots.some(s=>!s.querySelector('.token'))){ fb.className='feedback incorrect'; fb.innerHTML='네 결합 자리를 모두 채워 주세요.'; return; }
    const keys=slots.map(s=>s.querySelector('.token').dataset.k).sort();
    const ok=JSON.stringify(keys)===JSON.stringify([...NEED].sort());
    if(ok){ fb.className='feedback correct';
      fb.innerHTML='아미노산 완성! 🎉 모든 아미노산은 중심 탄소에 <b>아미노기(−NH₂)·카복실기(−COOH)·수소(−H)·곁사슬(−R)</b>이 결합해요. 곁사슬(R)만 20종으로 달라집니다.';
      winMission(vid,'aminobuild'); }
    else { fb.className='feedback incorrect';
      fb.innerHTML='아미노산의 구성 요소가 아니에요. 필요한 4가지는 <b>−NH₂, −COOH, −H, −R</b>입니다. (인산기·염기는 핵산의 성분)'; }
  };
}

/* ---- 단백질 미션 2: 펩타이드 결합 ---- */
function gamePeptide(){
  const vid='protein';
  gameShellV(vid,'펩타이드 결합','Peptide Bond','미션 2 · 조립',
    '아미노산 3개를 <b>빈자리</b>로 끌어다 순서대로 연결하세요. 결합이 생길 때마다 <b>물(H₂O)</b>이 빠져나가요(탈수 축합).','gb');
  const body=document.getElementById('gb');
  body.innerHTML=`
    <div id="chain" style="display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;margin-bottom:16px"></div>
    <div style="text-align:center;margin-bottom:14px">형성된 펩타이드 결합: <b id="bondN">0</b>개 · 방출된 물: <b id="waterN">0</b>분자 💧</div>
    <div class="pool" id="pool"></div>
    <div class="feedback" id="fb"></div>
    <div class="btnRow"><button class="ghost" id="reset">다시</button></div>`;
  const slots=[null,null,null];
  const aminos=[{n:'Gly',ko:'글리신'},{n:'Ala',ko:'알라닌'},{n:'Ser',ko:'세린'}];
  const chain=document.getElementById('chain'), pool=document.getElementById('pool');
  aminos.forEach(a=>{
    const t=document.createElement('div'); t.className='token'; t.dataset.n=a.n; t.dataset.ko=a.ko;
    t.innerHTML=`${a.ko}<span class="en">${a.n}</span>`;
    makeDraggable(t,{dropSelector:'[data-drop]', onDropTo:(el,zone)=>{
      const slot=zone.closest('.pslot');
      if(!slot){ pool.appendChild(el); return; }
      const idx=+slot.dataset.slot;
      if(slots[idx]) return;
      slots[idx]={n:el.dataset.n, ko:el.dataset.ko}; el.remove(); render();
    }});
    pool.appendChild(t);
  });
  function render(){
    chain.innerHTML='';
    for(let i=0;i<3;i++){
      if(i>0){
        const both=slots[i-1]&&slots[i];
        const c=document.createElement('span');
        c.style.cssText='min-width:24px;text-align:center;font-size:1.2rem';
        c.textContent=both?'🔗':'·'; c.style.opacity=both?'1':'.4';
        chain.appendChild(c);
      }
      const box=document.createElement('div'); box.className='pslot dz'; box.dataset.slot=i; box.setAttribute('data-drop','');
      box.style.cssText='width:76px;height:60px;border:2px dashed #cfcfe0;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fafaff;font-size:.85rem';
      const a=slots[i];
      if(a){ box.style.border='2px solid #ff8787'; box.style.background='#fff0f0'; box.innerHTML=`<b>${a.ko}</b><small style="color:#999">${a.n}</small>`; }
      else box.innerHTML='<span style="color:#bbb">빈자리</span>';
      chain.appendChild(box);
    }
    const bonds=(slots[0]&&slots[1]?1:0)+(slots[1]&&slots[2]?1:0);
    document.getElementById('bondN').textContent=bonds;
    document.getElementById('waterN').textContent=bonds;
    if(slots[0]&&slots[1]&&slots[2]){
      const fb=document.getElementById('fb'); fb.className='feedback correct';
      fb.innerHTML='폴리펩타이드 완성! 🎉 아미노산 3개가 <b>펩타이드 결합 2개</b>로 이어지고 <b>물 2분자</b>가 빠졌어요.';
      winMission(vid,'peptide');
    }
  }
  document.getElementById('reset').onclick=gamePeptide;
  render();
}

/* ---- 지질 미션 1: 중성지방 조립 ---- */
function gameTriglyceride(){

function gameBasePair(){
  const vid='nucleic';
  gameShellV(vid,'염기쌍 맞추기','Base Pairing','미션 1 · 상보결합',
    '왼쪽 가닥의 각 염기에 <b>상보적인 염기</b>를 끌어다 짝지으세요. <b>A-T, G-C</b> 규칙이에요.','gb');
  const body=document.getElementById('gb');
  const strand=['A','T','G','C'];
  const comp={A:'T',T:'A',G:'C',C:'G'};
  const colors={A:'#e5484d',T:'#f5b400',G:'#4a6cf7',C:'#2fb56b'};
  body.innerHTML=`
    <div id="rows" style="display:flex;flex-direction:column;gap:10px;max-width:420px;margin:0 auto 14px"></div>
    <div style="text-align:center;margin-bottom:8px;color:var(--muted);font-size:.9rem">아래 염기를 끌어 올리세요</div>
    <div class="pool" id="pool"></div>
    <div class="feedback" id="fb"></div>
    <div class="btnRow"><button class="ghost" id="reset">다시</button></div>`;
  const rows=document.getElementById('rows'), pool=document.getElementById('pool');
  const baseTag=(b,big)=>`<div style="width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;background:${colors[b]};font-size:${big?'1.1rem':'1rem'}">${b}</div>`;
  // 수소 결합 그래픽: A-T 2줄, G-C 3줄 (점선 평행선)
  const bondCount=top=>(top==='G'||top==='C')?3:2;
  const hbondSVG=n=>{
    const ys=n===3?[6,13,20]:[9,17];
    const lines=ys.map(y=>`<line x1="3" y1="${y}" x2="33" y2="${y}" stroke="#555a72" stroke-width="2.6" stroke-dasharray="3.2 2.4" stroke-linecap="round"/>`).join('');
    return `<svg viewBox="0 0 36 26" width="36" height="26" style="display:block">${lines}</svg>
      <span style="font-size:.62rem;color:#8a86a0;font-weight:700">${n}개</span>`;
  };
  const placeholder='<span style="color:#d0d0dc;font-weight:800;letter-spacing:2px">┄┄</span>';
  strand.forEach((b,i)=>{
    const row=document.createElement('div'); row.style.cssText='display:flex;align-items:center;gap:8px;justify-content:center';
    row.innerHTML=`${baseTag(b,true)}<span class="bondMark" data-i="${i}" style="width:44px;display:flex;flex-direction:column;align-items:center;justify-content:center">${placeholder}</span>`;
    const slot=document.createElement('div'); slot.className='baseSlot dz'; slot.dataset.need=comp[b]; slot.setAttribute('data-drop','');
    slot.style.cssText='width:46px;height:46px;border:2px dashed #cfcfe0;border-radius:10px;background:#fafaff';
    row.appendChild(slot); rows.appendChild(row);
  });
  ['A','T','G','C'].forEach(b=>{
    const t=document.createElement('div'); t.className='token'; t.dataset.base=b;
    t.style.cssText='padding:0;border:none;background:none;box-shadow:none';
    t.innerHTML=baseTag(b,false);
    makeDraggable(t,{dropSelector:'[data-drop]', onDropTo:(el,zone)=>{
      const slot=zone.closest('.baseSlot');
      if(!slot){ pool.appendChild(el); updateAll(); return; }
      const prev=slot.querySelector('.token'); if(prev) pool.appendChild(prev);
      slot.appendChild(el); updateAll();
    }});
    pool.appendChild(t);
  });
  function updateAll(){
    const slots=[...document.querySelectorAll('.baseSlot')];
    let filled=0, correct=0;
    slots.forEach((s,i)=>{
      const mark=document.querySelector(`.bondMark[data-i="${i}"]`);
      const tok=s.querySelector('.token');
      if(!tok){ mark.innerHTML=placeholder; return; }
      filled++;
      if(tok.dataset.base===s.dataset.need){ correct++; mark.innerHTML=hbondSVG(bondCount(strand[i])); }
      else mark.innerHTML='<span style="color:#f5576c;font-weight:800;font-size:1.2rem">✕</span>';
    });
    const fb=document.getElementById('fb');
    if(filled===slots.length && correct===slots.length){
      fb.className='feedback correct';
      fb.innerHTML='정답! 🎉 <b>A-T는 수소 결합 2개, G-C는 3개</b>로 결합해요. (샤가프 규칙: A=T, G≡C)';
      winMission(vid,'basepair');
    } else if(filled===slots.length){
      fb.className='feedback incorrect';
      fb.innerHTML='상보 결합이 맞지 않아요. <b>A-T, G-C</b> 규칙을 떠올려 보세요.';
    } else { fb.className='feedback'; }
  }
  document.getElementById('reset').onclick=gameBasePair;
}

/* ---- 핵산 미션 2: 뉴클레오타이드 조립 ---- */
function gameNucleotide(){
  const vid='nucleic';
  gameShellV(vid,'뉴클레오타이드 조립','Build Nucleotide','미션 2 · 조립',
    '뉴클레오타이드의 세 요소 <b>인산·당·염기</b> 자리에 알맞은 조각을 끌어다 놓으세요. (지방산·아미노산은 핵산의 구성 요소가 아니에요)','gb');
  const body=document.getElementById('gb');
  body.innerHTML=`
    <div id="slots" style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:16px"></div>
    <div class="pool" id="pool"></div>
    <div class="feedback" id="fb"></div>
    <div class="btnRow"><button class="ghost" id="reset">다시</button><button class="primary" id="submit">확인</button></div>`;
  const need=[{need:'p',ko:'인산',en:'Phosphate'},{need:'sugar',ko:'당',en:'Sugar'},{need:'base',ko:'염기',en:'Base'}];
  const slotsBox=document.getElementById('slots'), pool=document.getElementById('pool');
  need.forEach((s,i)=>{
    const slot=document.createElement('div'); slot.className='nSlot dz'; slot.dataset.need=s.need; slot.dataset.slot=i; slot.setAttribute('data-drop','');
    slot.style.cssText='width:110px;min-height:88px;border:2px dashed #cfcfe0;border-radius:12px;background:#fafaff;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:8px';
    slot.innerHTML=`<div style="font-weight:800;color:#666">${s.ko}<div class="en">${s.en}</div></div><div class="hold" style="margin-top:6px"></div>`;
    slotsBox.appendChild(slot);
  });
  const pieces=[{k:'p',ko:'인산',en:'Phosphate'},{k:'sugar',ko:'디옥시라이보스',en:'Deoxyribose'},{k:'base',ko:'염기 A',en:'Adenine'},
                {k:'x',ko:'지방산',en:'Fatty acid'},{k:'x',ko:'아미노산',en:'Amino acid'}];
  pieces.sort(()=>Math.random()-.5).forEach(p=>{
    const t=document.createElement('div'); t.className='token'; t.dataset.k=p.k;
    t.innerHTML=`${p.ko}<span class="en">${p.en}</span>`;
    makeDraggable(t,{dropSelector:'[data-drop]', onDropTo:(el,zone)=>{
      const slot=zone.closest('.nSlot');
      if(!slot){ pool.appendChild(el); return; }
      const hold=slot.querySelector('.hold'); const prev=hold.querySelector('.token'); if(prev) pool.appendChild(prev);
      hold.appendChild(el); document.getElementById('fb').className='feedback';
    }});
    pool.appendChild(t);
  });
  document.getElementById('reset').onclick=gameNucleotide;
  document.getElementById('submit').onclick=()=>{
    const slots=[...document.querySelectorAll('.nSlot')];
    const fb=document.getElementById('fb');
    if(slots.some(s=>!s.querySelector('.token'))){ fb.className='feedback incorrect'; fb.innerHTML='세 자리를 모두 채워 주세요.'; return; }
    const allOk=slots.every(s=>s.querySelector('.token').dataset.k===s.dataset.need);
    if(allOk){ fb.className='feedback correct'; fb.innerHTML='뉴클레오타이드 완성! 🎉 <b>인산 + 당(디옥시라이보스) + 염기</b>가 핵산의 기본 단위예요.'; winMission(vid,'nucleotide'); }
    else { fb.className='feedback incorrect'; fb.innerHTML='조각이 맞지 않아요. 핵산의 단위는 <b>인산·당·염기</b>예요. (지방산·아미노산 ✕)'; }
  };
}

renderHome();
</script>
